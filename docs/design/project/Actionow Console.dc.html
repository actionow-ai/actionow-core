<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .ano{
    --accent:#ffd60a; --accent-2:#ff9f0a; --ink:#1c1500;
    --grad-accent:linear-gradient(135deg,var(--accent),var(--accent-2));
    --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;--s-8:32px;--s-10:40px;
    --r-sm:11px;--r-md:14px;--r-lg:18px;--r-pill:999px;
    --fs-nano:9px;--fs-micro:10px;--fs-caption:11px;--fs-sm:13px;--fs-base:15px;--fs-md:16px;--fs-lg:18px;--fs-xl:24px;--fs-2xl:30px;
    --shadow-cta:0 8px 20px rgba(255,176,10,.3);
    --shadow-cta-hover:0 12px 28px rgba(255,176,10,.42);
    --glow-accent:0 0 6px rgba(255,176,10,.35);
    --shadow-lift:0 5px 14px rgba(0,0,0,.34);
    --bg:#0c0b09;--text:#f2efe6;--muted:#b8b2a3;--faint:#a39c8b;
    --glass-bg:rgba(255,255,255,.06);--glass-bd:rgba(255,255,255,.12);--glass-hl:rgba(255,255,255,.22);
    --glass-shadow:0 1px 1px rgba(0,0,0,.25),0 12px 28px rgba(0,0,0,.4);
    --panel-bg:rgba(18,16,12,.82);--panel-bd:rgba(255,255,255,.08);
    --nav-bg:rgba(14,12,9,.94);--overlay-bg:rgba(28,25,19,.97);
    --hover-bg:rgba(255,214,10,.08);--hover-bd:rgba(255,214,10,.28);
    --row-bd:rgba(255,255,255,.06);--grid-dot:rgba(255,255,255,.05);--scrim:rgba(0,0,0,.45);
    --ok:#4ade80;--run:#fbbf24;--wait:#fb923c;--fail:#f87171;--idle:#9a9384;--log-ok:#9bdcb0;
    color:var(--text);
    font-family:-apple-system,system-ui,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .ano[data-theme='light']{
    --bg:#f3f0e7;--text:#272219;--muted:#5f5849;--faint:#9b927f;
    --glass-bg:rgba(255,255,255,.55);--glass-bd:rgba(0,0,0,.06);--glass-hl:rgba(255,255,255,.7);
    --glass-shadow:0 1px 2px rgba(60,45,5,.05),0 10px 24px rgba(120,90,20,.1);
    --shadow-lift:0 5px 14px rgba(120,90,20,.16);
    --panel-bg:rgba(255,255,255,.72);--panel-bd:rgba(0,0,0,.06);
    --nav-bg:rgba(245,242,233,.93);--overlay-bg:rgba(252,250,245,.98);
    --hover-bg:rgba(245,158,11,.1);--hover-bd:rgba(245,158,11,.35);
    --row-bd:rgba(0,0,0,.05);--grid-dot:rgba(0,0,0,.05);--scrim:rgba(40,30,5,.32);
    --ok:#16a34a;--run:#d9920a;--wait:#ea7a26;--fail:#dc2626;--idle:#7a7263;--log-ok:#2f7d4f;
  }
  .ano *{box-sizing:border-box;min-width:0}
  .ano .tabular{font-variant-numeric:tabular-nums}
  .ano .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
  .glass{background:var(--glass-bg);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--glass-bd);box-shadow:inset 0 1px 0 var(--glass-hl),var(--glass-shadow)}
  .panel{background:var(--panel-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--panel-bd)}
  .chip{font-size:var(--fs-caption);color:var(--muted);background:var(--hover-bg);border:1px solid var(--panel-bd);border-radius:var(--r-pill);padding:2px 9px;white-space:nowrap}
  .card-glyph{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink);background:var(--grad-accent)}
  .entity-card{position:relative;border-radius:var(--r-md);padding:var(--s-5);background:var(--panel-bg);border:1px solid var(--panel-bd);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
  .entity-card.click{cursor:pointer}
  .entity-card.click:hover{transform:translateY(-2px);border-color:var(--hover-bd);box-shadow:var(--shadow-lift)}
  .entity-card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .navico{position:relative;z-index:1;width:40px;height:40px;border-radius:var(--r-sm);border:none;background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .18s ease,background .18s ease}
  .navico:hover{color:var(--text);background:var(--hover-bg)}
  .navico.on{color:var(--ink)}
  .navico.on:hover{color:var(--ink);background:transparent}
  .ico-btn{width:40px;height:40px;border-radius:var(--r-sm);border:none;background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .18s,background .18s}
  .ico-btn:hover{color:var(--text);background:var(--hover-bg)}
  .subitem{position:relative;z-index:1;display:flex;align-items:center;height:34px;margin-bottom:4px;padding:0 10px;border-radius:var(--r-sm);font-size:var(--fs-sm);white-space:nowrap;cursor:pointer;color:var(--muted);transition:color .15s}
  .subitem:hover{color:var(--text)}
  .subitem.on{color:var(--text)}
  .pill{font-size:var(--fs-caption);font-weight:600;padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap}
  .pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
  .pill.run{color:var(--run);background:color-mix(in srgb,var(--run) 16%,transparent)}
  .pill.wait{color:var(--wait);background:color-mix(in srgb,var(--wait) 16%,transparent)}
  .pill.fail{color:var(--fail);background:color-mix(in srgb,var(--fail) 16%,transparent)}
  .pill.idle{color:var(--idle);background:color-mix(in srgb,var(--idle) 16%,transparent)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:var(--fs-sm);font-weight:600;border-radius:var(--r-sm);padding:9px 15px;cursor:pointer;border:1px solid transparent;white-space:nowrap;transition:transform .15s,box-shadow .15s,background .15s,border-color .15s;font-family:inherit}
  .btn.cta{background:var(--grad-accent);color:var(--ink);box-shadow:var(--shadow-cta)}
  .btn.cta:hover{transform:translateY(-1px);box-shadow:var(--shadow-cta-hover)}
  .btn.cta:active{transform:translateY(1px) scale(.99)}
  .btn.ghost{background:var(--glass-bg);border-color:var(--panel-bd);color:var(--text)}
  .btn.ghost:hover{border-color:var(--hover-bd);background:var(--hover-bg)}
  .btn.sm{padding:6px 11px;font-size:var(--fs-caption)}
  .btn.lg{padding:13px 20px;font-size:var(--fs-base)}
  .fld label{display:block;font-size:var(--fs-caption);color:var(--muted);margin-bottom:6px;font-weight:600}
  .fld input,.fld select,.fld textarea{width:100%;font-family:inherit;font-size:var(--fs-sm);color:var(--text);background:var(--glass-bg);border:1px solid var(--panel-bd);padding:9px 11px;border-radius:var(--r-sm);outline:none;transition:border-color .15s,box-shadow .15s}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--hover-bd);box-shadow:0 0 0 1px var(--hover-bd)}
  .fld select{cursor:pointer}
  .ptile{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:var(--r-sm);background:linear-gradient(180deg,#fff,#f4efe2);border:1px solid rgba(28,21,0,.09);box-shadow:0 1px 2px rgba(28,21,0,.12),inset 0 1px 0 rgba(255,255,255,.75)}
  .ptile.dark{background:linear-gradient(180deg,#2a2a2e,#131316);border-color:rgba(255,255,255,.14)}
  .ptile img{display:block}
  .row{border-bottom:1px solid var(--row-bd);cursor:default;transition:background .15s}
  .row.click{cursor:pointer}
  .row.click:hover{background:var(--hover-bg)}
  .rowact{width:30px;height:30px;flex-shrink:0;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .15s,background .15s,border-color .15s}
  .rowact:hover{color:var(--text);background:var(--hover-bg);border-color:var(--hover-bd)}
  .rowact.danger:hover{color:var(--fail);border-color:var(--fail)}
  .seg{display:inline-flex;background:var(--glass-bg);border:1px solid var(--panel-bd);border-radius:var(--r-sm);padding:3px;gap:2px}
  .seg button{font-family:inherit;font-size:var(--fs-sm);font-weight:600;border:none;background:transparent;color:var(--muted);padding:6px 13px;border-radius:8px;cursor:pointer;transition:color .15s,background .15s;white-space:nowrap}
  .seg button.on{background:var(--grad-accent);color:var(--ink)}
  .tabx{position:relative;padding:10px 2px;border:none;background:transparent;cursor:pointer;font-size:var(--fs-sm);font-weight:600;white-space:nowrap;color:var(--muted);font-family:inherit}
  .tabx.on{color:var(--text)}
  .tabx .ul{position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:999px;background:var(--grad-accent);opacity:0}
  .tabx.on .ul{opacity:1}
  .scrim{position:fixed;inset:0;background:var(--scrim);z-index:90;backdrop-filter:blur(2px)}
  .bg-grid{position:absolute;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(var(--grid-dot) 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:radial-gradient(ellipse 85% 55% at 50% 0%,#000 35%,transparent 72%);mask-image:radial-gradient(ellipse 85% 55% at 50% 0%,#000 35%,transparent 72%)}
  .scroll::-webkit-scrollbar{width:10px;height:10px}
  .scroll::-webkit-scrollbar-thumb{background:var(--panel-bd);border-radius:8px;border:3px solid transparent;background-clip:padding-box}
  @keyframes ano-toast{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes ano-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .drawer-in{animation:ano-slide .26s cubic-bezier(.2,.8,.2,1)}
  @keyframes ano-slide{from{transform:translateX(100%)}to{transform:translateX(0)}}
  .stage[data-device='desktop']{align-items:stretch}
  .stage[data-device='mobile']{padding:24px 0}
  .stage[data-device='mobile'] .frame{width:402px;height:844px;border-radius:46px;padding:11px;background:linear-gradient(160deg,#16140f,#0a0908);box-shadow:0 0 0 2px rgba(255,255,255,.06),0 40px 80px rgba(0,0,0,.55);flex:none}
  .stage[data-device='mobile'] .frame .screen{width:100%;height:100%;border-radius:36px;overflow:hidden;position:relative;background:var(--bg)}
  .stage[data-device='desktop'] .frame{flex:1;align-self:stretch;min-height:100%}
  .stage[data-device='desktop'] .frame .screen{width:100%;height:100%;min-height:100%;position:relative;background:var(--bg)}
  .stage[data-device='desktop'] [data-shell]{--gap:var(--s-3);--pad:var(--s-5)}
  .stage[data-device='mobile'] [data-shell]{--gap:var(--s-2);--pad:var(--s-3)}
</style>
</helmet>

<div class="ano" data-theme="{{ theme }}" style="height:100vh;display:flex;flex-direction:column;background:#000;overflow:hidden">

  <!-- prototype control bar -->
  <div style="flex:none;height:54px;display:flex;align-items:center;gap:var(--s-4);padding:0 var(--s-5);background:#0a0908;border-bottom:1px solid rgba(255,255,255,.07);color:#f2efe6">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="width:26px;height:26px;border-radius:7px;background:var(--grad-accent);display:inline-flex;align-items:center;justify-content:center;color:#1c1500;box-shadow:var(--glow-accent)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path></svg>
      </span>
      <span style="font-weight:700;font-size:14px;letter-spacing:-.01em">Actionow</span>
      <span style="font-size:11px;color:#8b8576;border-left:1px solid rgba(255,255,255,.1);padding-left:10px">原型 · {{ topTitle }}</span>
    </div>
    <div style="flex:1"></div>
    <div class="seg">
      <button class="{{ pcClass }}" onClick="{{ setPC }}">PC 端</button>
      <button class="{{ mobileClass }}" onClick="{{ setMobile }}">移动端</button>
    </div>
    <div class="seg">
      <button class="{{ darkClass }}" onClick="{{ setDark }}">深色</button>
      <button class="{{ lightClass }}" onClick="{{ setLight }}">浅色</button>
    </div>
  </div>

  <!-- stage -->
  <div class="stage scroll" data-device="{{ device }}" style="flex:1;min-height:0;overflow:auto;background:radial-gradient(circle at 50% 0%,#15130e,#08070500);display:flex;align-items:flex-start;justify-content:center;padding:0">
    <div class="frame" style="display:flex;align-items:center;justify-content:center">
      <div class="screen scroll">

        <!-- ============ CONSOLE SHELL ============ -->
        <sc-if value="{{ inConsole }}" hint-placeholder-val="{{ true }}">
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)">
          <div class="bg-grid"></div>
          <div style="position:relative;z-index:1;flex:1;min-height:0;display:flex;gap:var(--gap);padding:var(--pad)" data-shell>

            <!-- desktop rail -->
            <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
            <div class="glass" style="width:64px;flex:none;border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;gap:var(--s-4);padding:var(--s-4) 0">
              <span style="width:30px;height:30px;border-radius:8px;background:var(--grad-accent);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:var(--glow-accent)">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path></svg>
              </span>
              <div style="position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:var(--s-3)">
                <span aria-hidden="true" style="position:absolute;top:0;left:50%;width:40px;height:40px;margin-left:-20px;border-radius:var(--r-sm);background:var(--grad-accent);box-shadow:var(--shadow-cta);z-index:0;transform:translateY({{ railIndicator }}px);transition:transform .26s cubic-bezier(.2,.8,.2,1)"></span>
                <sc-for list="{{ navGroups }}" as="g" hint-placeholder-count="4">
                  <button class="navico {{ g.cls }}" onClick="{{ g.go }}" title="{{ g.label }}">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{ g.icon }}"></path></svg>
                  </button>
                </sc-for>
              </div>
              <div style="display:flex;flex-direction:column;align-items:center;gap:var(--s-2)">
                <button class="ico-btn" onClick="{{ toggleTheme }}" title="主题">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{ themeIcon }}"></path></svg>
                </button>
                <button class="ico-btn" onClick="{{ goLogin }}" title="退出登录">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>
                </button>
              </div>
            </div>
            </sc-if>

            <!-- desktop subnav -->
            <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
            <div class="glass" style="width:200px;flex:none;border-radius:var(--r-lg);padding:var(--s-4) var(--s-3)">
              <div style="font-size:var(--fs-caption);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 var(--s-2) var(--s-3)">{{ subNavGroup }}</div>
              <div style="position:relative">
                <span aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:34px;border-radius:var(--r-sm);background:var(--hover-bg);border:1px solid var(--hover-bd);transform:translateY({{ subIndicator }}px);transition:transform .26s cubic-bezier(.2,.8,.2,1)"></span>
                <sc-for list="{{ subNav }}" as="it" hint-placeholder-count="3">
                  <div class="subitem {{ it.cls }}" onClick="{{ it.go }}">{{ it.label }}</div>
                </sc-for>
              </div>
            </div>
            </sc-if>

            <!-- main -->
            <div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--s-3)">

              <!-- topbar -->
              <div class="glass" style="flex:none;border-radius:var(--r-md);padding:var(--s-3) var(--s-4);display:flex;flex-direction:column;gap:var(--s-3)">
                <div style="display:flex;align-items:center;gap:var(--s-3)">
                  <sc-if value="{{ showBack }}" hint-placeholder-val="{{ false }}">
                    <button class="ico-btn" onClick="{{ clearResSel }}" style="flex:none"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></button>
                  </sc-if>
                  <div style="flex:1;min-width:0">
                    <div style="font-size:var(--fs-lg);font-weight:700;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ topTitle }}</div>
                    <div style="font-size:var(--fs-sm);color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ topSubtitle }}</div>
                  </div>
                  <!-- filters slot -->
                  <sc-if value="{{ showTenantFilter }}" hint-placeholder-val="{{ false }}">
                    <select class="fld" style="font-size:var(--fs-sm);background:var(--glass-bg);color:var(--text);border:1px solid var(--panel-bd);border-radius:var(--r-sm);padding:8px 10px;flex:none;width:160px" value="{{ filterTenant }}" onChange="{{ onFilterTenant }}">
                      <sc-for list="{{ tenantOptions }}" as="o" hint-placeholder-count="3"><option value="{{ o.id }}">{{ o.name }}</option></sc-for>
                    </select>
                  </sc-if>
                  <!-- action slot -->
                  <sc-if value="{{ pageAction.show }}" hint-placeholder-val="{{ false }}">
                    <button class="btn ghost" style="flex:none" onClick="{{ pageAction.go }}">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>{{ pageAction.label }}
                    </button>
                  </sc-if>
                  <button class="ico-btn" style="flex:none" onClick="{{ noop }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"></path></svg></button>
                </div>
              </div>

              <!-- content -->
              <div class="scroll" style="flex:1;min-height:0;overflow:auto">
                <div data-content style="min-height:100%">
                {{ contentSlot }}
                </div>
              </div>

              <!-- mobile bottom tabs -->
              <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
              <div class="glass" style="flex:none;border-radius:var(--r-lg);display:flex;justify-content:space-around;padding:var(--s-2)">
                <sc-for list="{{ mobileTabs }}" as="tb" hint-placeholder-count="4">
                  <div onClick="{{ tb.go }}" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-height:44px;justify-content:center;font-size:var(--fs-micro);padding:6px 12px;border-radius:var(--r-sm);cursor:pointer;color:{{ tb.color }}">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{ tb.icon }}"></path></svg>
                    {{ tb.label }}
                  </div>
                </sc-for>
              </div>
              </sc-if>
            </div>
          </div>
        </div>
        </sc-if>

        <!-- ============ FULLSCREEN ROUTES ============ -->
        <sc-if value="{{ rLanding }}" hint-placeholder-val="{{ false }}">{{ landingSlot }}</sc-if>
        <sc-if value="{{ rLogin }}" hint-placeholder-val="{{ false }}">{{ loginSlot }}</sc-if>
        <sc-if value="{{ rApp }}" hint-placeholder-val="{{ false }}">{{ appSlot }}</sc-if>

      </div>
    </div>
  </div>

  <!-- toast -->
  <sc-if value="{{ toastShow }}" hint-placeholder-val="{{ false }}">
    <div class="ano panel" data-theme="{{ theme }}" style="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:300;padding:11px 18px;border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:600;color:var(--text);box-shadow:var(--shadow-lift);animation:ano-toast .3s ease">{{ toastMsg }}</div>
  </sc-if>

  <!-- ============ DIALOGS ============ -->
  <sc-if value="{{ dialogShow }}" hint-placeholder-val="{{ false }}">
    <div class="scrim" onClick="{{ closeDialog }}"></div>
    <!-- modal (centered) -->
    <sc-if value="{{ dialogIsModal }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;pointer-events:none">
      <div class="ano glass scroll" data-theme="{{ theme }}" style="pointer-events:auto;width:min(440px,94vw);max-height:88vh;overflow:auto;border-radius:var(--r-lg);padding:var(--s-6);animation:ano-fade .24s ease">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s-5)">
          <div style="font-size:var(--fs-lg);font-weight:700">{{ dialogTitle }}</div>
          <button class="ico-btn" onClick="{{ closeDialog }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
        </div>

    if(k==='account-topup') return [this.field('充值额度 (credits)','credits',{type:'number',placeholder:'100000'})];
    if(k==='price-edit') return [this.field('Provider','provider',{}), this.field('模型标识','slug',{}), this.field('显示名','name',{}), this.field('输入价 ($ /1M)','in',{type:'number'}), this.field('输出价 ($ /1M)','out',{type:'number'}), this.field('生效日期','eff',{type:'date'})];

    ];

  dialogFooter(){
    const k=this.state.dialog;

    const navGroups=groups.map((g,i)=>({label:g.label,icon:g.icon,cls:i===activeGroupIdx?'on':'',go:this.go(g.items[0])}));
    const ag=groups[activeGroupIdx]||groups[0];
    const subNav=ag.items.map(it=>({label:titles[it],cls:s.route===it?'on':'',go:this.go(it)}));
    const subIdx=ag.items.indexOf(s.route);

    const mobileTabs=mtabs.map(t=>({label:t.l,icon:t.ic,color:s.route===t.r?'var(--accent)':'var(--muted)',go:this.go(t.r)}));

    // page action button
    const actionMap={

      apiKeys:{label:'签发 Key',go:()=>this.openDialog('key-new',{group:''})},
      accounts:{label:'新建账户',go:()=>this.openDialog('account-new',{tenant:s.tenants[0].id})},
      modifiers:{label:'新建规则',go:()=>this.openDialog('modifier-new',{op:'percent_off'})},
      groups:{label:'新建分组',go:()=>this.openDialog('group-edit',{name:'',ratio:100,status:'active',description:''})},
      officialPrices:{label:'新建官方价',go:()=>this.openDialog('price-edit',{provider:'openai',slug:'',name:'',in:'',out:'',eff:''})},

    const showTenantFilter=(s.route==='dashboard'||s.route==='apiKeys');
    const showBack=(s.route==='catalog'&&s.catTab==='resources'&&s.resSel!==''&&isMobile);

    return {
      theme:s.theme, device:s.device,
      inConsole, isDesktop, isMobile,
      rLanding:s.route==='landing', rLogin:s.route==='login', rApp:s.route==='app',
      topTitle: inConsole? titles[s.route] : (s.route==='landing'?'官网':s.route==='login'?'登录':'租户主页'),
      topSubtitle: subtitles[s.route]||'',
      navGroups, subNav, subNavGroup:ag.label, mobileTabs,

      showTenantFilter, filterTenant:s.filterTenant,
      tenantOptions:s.tenants, onFilterTenant:(e)=>this.setState({filterTenant:e.target.value}),
      showBack, clearResSel:()=>this.setState({resSel:''}),
      contentSlot: inConsole? this.contentSlot() : null,
      landingSlot: s.route==='landing'? this.landingSlot():null,
      loginSlot: s.route==='login'? this.loginSlot():null,
      appSlot: s.route==='app'? this.appSlot():null,
      themeIcon: s.theme==='dark'?'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z':'M12 2v2M12 20v2M5 5l1.5 1.5M17.5 17.5 19 19M2 12h2M20 12h2M5 19l1.5-1.5M17.5 6.5 19 5M12 8a4 4 0 100 8 4 4 0 000-8z',

      setPC:()=>this.setState({device:'desktop'}), setMobile:()=>this.setState({device:'mobile'}),
      setDark:()=>this.setState({theme:'dark'}), setLight:()=>this.setState({theme:'light'}),
      pcClass:isDesktop?'on':'', mobileClass:isMobile?'on':'', darkClass:s.theme==='dark'?'on':'', lightClass:s.theme==='light'?'on':'',
      // dialogs
      dialogShow: s.dialog!==null,
      dialogIsModal: ['tenant-new','key-new','key-reveal','key-revoke','account-new','account-topup','modifier-new'].includes(s.dialog),
