# Serves the actionow web SPA and reverse-proxies the API on the SAME ORIGIN
# (so no CORS is needed). Browser navigation (`Accept: text/html`) always gets
# the SPA; XHR/fetch (the typed SDK; `Accept: */*` or application/json) gets the
# API. This matters for `/console`, which is BOTH an admin-console UI route
# prefix AND the tenant self-service API prefix.

# 1 = the request is a top-level browser navigation (wants HTML) → serve the SPA.
map $http_accept $wants_html {
  default        0;
  "~*text/html"  1;
}

upstream actionow_api {
  server api:3000;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # OAuth hand-off: the API 302-redirects the browser to `/auth/callback#token=…`.
  # This is a top-level navigation (the SPA never XHRs it), so it must serve the
  # SPA — NOT the api (which owns the rest of `/auth/*`). An exact-match `=`
  # location outranks the `/auth` regex below, so this wins regardless of order.
  location = /auth/callback {
    rewrite ^ /index.html last;
  }

  # API-only prefixes (no web route lives here) → always the api.
  location ~ ^/(v1|v1beta|admin|auth|health|ready)(/|$) {
    proxy_pass http://actionow_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # SSE (chat streaming) + long media-dialect waits: don't buffer / don't time out early.
    proxy_buffering off;
    proxy_read_timeout 600s;
  }

  # /console is shared: admin-console UI routes (browser nav → SPA) AND the
  # tenant self-service API (XHR → api). Split on the Accept header.
  location ~ ^/console(/|$) {
    if ($wants_html) {
      rewrite ^ /index.html last;
    }
    proxy_pass http://actionow_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 600s;
  }

  # Everything else (/, /login, /app/*, assets) → the SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
