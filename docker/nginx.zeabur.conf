# Zeabur variant of docker/nginx.conf for the `web` service. Identical to it,
# except the API upstream points at the Zeabur API service by its service name
# (`api-gw`) — Zeabur resolves service names over the project's private network.
# (docker-compose.app.yml keeps using docker/nginx.conf, whose upstream is the
# compose service `api`.) Same-origin proxy, so no CORS is needed.

map $http_accept $wants_html {
  default        0;
  "~*text/html"  1;
}

upstream actionow_api {
  server api-gw:3000;
}

server {
  # Zeabur routes ingress to the service's container port 8080 (its HTTP default),
  # not the nginx default 80 — listen on 8080 so the public domain reaches nginx.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # OAuth hand-off: the API 302-redirects to `/auth/callback#token=…` (top-level
  # navigation) → serve the SPA, NOT the api (which owns the rest of `/auth/*`).
  location = /auth/callback {
    rewrite ^ /index.html last;
  }

  # API-only prefixes (no web route lives here) → always the api.
  location ~ ^/(v1|v1beta|admin|auth|health|ready)(/|$) {
    proxy_pass http://actionow_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # SSE (chat streaming) + long media-dialect waits: don't buffer / don't time out early.
    proxy_buffering off;
    proxy_read_timeout 600s;
  }

  # /console is shared: admin-console UI routes (browser nav → SPA) AND the
  # tenant self-service API (XHR → api). Split on the Accept header.
  location ~ ^/console(/|$) {
    if ($wants_html) {
      rewrite ^ /index.html last;
    }
    proxy_pass http://actionow_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 600s;
  }

  # Everything else (/, /login, /app/*, assets) → the SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
