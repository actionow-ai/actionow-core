services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: actionow
      POSTGRES_PASSWORD: actionow
      POSTGRES_DB: actionow
    ports: ['5433:5432']
    volumes: ['actionow_pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U actionow']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6380:6379']
    volumes: ['actionow_redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: actionow
      MINIO_ROOT_PASSWORD: actionow123
    # Host 9000/9001 may be taken by another local stack; map to 9100/9101.
    # The integration test uses Testcontainers (random port) and is independent
    # of this compose entry, which is for local dev only.
    ports: ['9100:9000', '9101:9001']
    volumes: ['actionow_minio:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  actionow_pg:
  actionow_redis:
  actionow_minio:
