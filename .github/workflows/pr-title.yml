name: pr-title

# Server-side Conventional-Commit check on the PR TITLE. The local commit-msg
# hook (commitlint) is `--no-verify`-bypassable; this is not. It is load-bearing:
# we squash-merge, so the PR title becomes the `main` commit and the CHANGELOG
# entry release-please parses. Types mirror @commitlint/config-conventional.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    name: semantic PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Scope is optional; when present it must be lower-kebab (matches our scopes).
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start lower-case and be imperative
            (e.g. "add X", not "Added X").
